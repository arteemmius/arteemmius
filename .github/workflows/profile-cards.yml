# Regenerates the images used in README.md: GitHub stats card + contribution snake.
# Location in the repo: .github/workflows/profile-cards.yml (repo arteemmius/arteemmius)
name: Profile cards

on:
  schedule:
    - cron: "0 3 * * *"        # daily at 06:00 Moscow time
  workflow_dispatch:           # "Run workflow" button on the Actions tab
  push:
    paths:
      - .github/workflows/profile-cards.yml   # first run right after this file is committed

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Start from an empty folder so renamed or removed images don't linger in the repo
      - name: Reset output folder
        run: rm -rf profile

      # Solid dark card: stays readable whatever theme GitHub or the viewer's system reports.
      # GITHUB_TOKEN only sees public repositories. To count private work: create a classic PAT
      # with the `repo` and `read:user` scopes, save it as the PROFILE_PAT repository secret and
      # replace secrets.GITHUB_TOKEN with secrets.PROFILE_PAT below.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_title=true&hide=issues,contribs&include_all_commits=true&disable_animations=true&border_radius=6&bg_color=161B22&border_color=30363D&text_color=E6EDF3&icon_color=A78BFA
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true   # keep yesterday's card instead of committing an error card

      # Transparent background; dots use alpha, so the grid blends into light and dark pages alike
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#E44857&color_dots=#8B949E26,#8B5CF64D,#8B5CF680,#8B5CF6B3,#8B5CF6

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          git commit -m "chore: refresh profile cards"
          git push
